name: Archive deployment history
on:
  push:
    branches: [Rollback-version2]
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [Rollback-version2]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: alcoholaway-deployment-history
  cancel-in-progress: false
jobs:
  archive:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release-history.mjs
            /release-notes/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Archive successful site deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-history.mjs
