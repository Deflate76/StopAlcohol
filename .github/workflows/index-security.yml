name: Index security checks

on:
  pull_request:
    branches: [Rollback-version2]
    paths: [index.html, community-feed.js, recovery-goals.js, community-recovery.css, app-loading.js, release-history.js, release-history.css, app-build.json, release-history-seed.json, release-notes/**, scripts/release-history.mjs, .github/workflows/release-history.yml, record-section-ui.js, record-activity.js, floating-actions.js, progress-chart.js, account-deletion.js, daily-wisdom.js, daily-health-tools.js, calendar-environment.js, calendar-navigation.js, korean-calendar.js, vendor/suncalc-1.9.0.js, scripts/update-index-csp.py, security-tests/**, .github/workflows/index-security.yml]
  push:
    branches: [Rollback-version2]
    paths: [index.html, community-feed.js, recovery-goals.js, community-recovery.css, app-loading.js, release-history.js, release-history.css, app-build.json, release-history-seed.json, release-notes/**, scripts/release-history.mjs, .github/workflows/release-history.yml, record-section-ui.js, record-activity.js, floating-actions.js, progress-chart.js, account-deletion.js, daily-wisdom.js, daily-health-tools.js, calendar-environment.js, calendar-navigation.js, korean-calendar.js, vendor/suncalc-1.9.0.js, scripts/update-index-csp.py, security-tests/**, .github/workflows/index-security.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /app-loading.js
            /community-feed.js
            /recovery-goals.js
            /community-recovery.css
            /release-history.js
            /release-history.css
            /app-build.json
            /release-history-seed.json
            /release-notes/
            /scripts/release-history.mjs
            /.github/workflows/release-history.yml
            /progress-chart.js
            /account-deletion.js
            /record-section-ui.js
            /record-activity.js
            /floating-actions.js
            /daily-wisdom.js
            /daily-health-tools.js
            /calendar-environment.js
            /calendar-navigation.js
            /korean-calendar.js
            /vendor/suncalc-1.9.0.js
            /scripts/update-index-csp.py
            /security-tests/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: security-tests/package-lock.json
      - run: npm ci --prefix security-tests --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix security-tests
