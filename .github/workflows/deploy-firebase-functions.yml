name: Firebase functions

on:
  pull_request:
    branches: [Rollback-version2]
    paths:
      - schedule-reminders/**
      - firestore-admin/**
      - admin.html
      - firebase-messaging-sw.js
      - .github/workflows/deploy-firebase-functions.yml
  push:
    branches: [Rollback-version2]
    paths:
      - schedule-reminders/**
      - firestore-admin/**
      - admin.html
      - firebase-messaging-sw.js
      - .github/workflows/deploy-firebase-functions.yml
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an active deployment. PR checks use a separate concurrency group.
concurrency:
  group: firebase-daily-schedules-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /schedule-reminders/
            /firestore-admin/
            /admin.html
            /firebase-messaging-sw.js
            /.github/workflows/deploy-firebase-functions.yml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            schedule-reminders/functions/package-lock.json
            firestore-admin/functions/package-lock.json
      - run: npm ci --prefix schedule-reminders/functions --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix schedule-reminders/functions
      - run: bash -n schedule-reminders/setup-github-deploy.sh
      - run: bash -n schedule-reminders/setup-account-deletion.sh
      - run: node --test schedule-reminders/test-setup.mjs
      - run: npm ci --prefix firestore-admin/functions --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix firestore-admin/functions
      - run: bash -n firestore-admin/enable-auto-deploy.sh

  deploy:
    needs: test
    if: >-
      github.repository_id == '1207749530' &&
      github.ref == 'refs/heads/Rollback-version2' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /schedule-reminders/
            /firestore-admin/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            schedule-reminders/functions/package-lock.json
            firestore-admin/functions/package-lock.json
      - run: npm ci --prefix schedule-reminders/functions --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix firestore-admin/functions --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm install --global firebase-tools@15.31.0 --ignore-scripts --no-audit --no-fund
      # Authenticate after installing dependencies so the short-lived identity is fresh.
      - name: Authenticate to Firebase project
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: alcoholaway
          workload_identity_provider: projects/1001199235857/locations/global/workloadIdentityPools/alcoholaway-github/providers/stopalcohol
          service_account: firebase-github-deploy@alcoholaway.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Configure narrowly scoped account deletion permissions
        id: account_permissions
        continue-on-error: true
        run: bash schedule-reminders/setup-account-deletion.sh
      - name: Deploy schedule functions
        working-directory: schedule-reminders
        run: firebase deploy --config "$GITHUB_WORKSPACE/schedule-reminders/firebase.json" --project alcoholaway --only functions:daily-schedules --non-interactive
      - name: Deploy Firestore administrator API
        working-directory: firestore-admin
        run: firebase deploy --config "$GITHUB_WORKSPACE/firestore-admin/firebase.json" --project alcoholaway --only functions:firestore-admin --non-interactive
      - name: Deployment result
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          일정 API·푸시 리마인드·Firestore 관리자 API를 alcoholaway / asia-northeast3에 배포했습니다.
          배포 대상: dailyScheduleApi, dispatchDailyScheduleReminders, dailyWisdomApi, deleteMyAccount, retryAccountDeletions, firestoreAdminApi
          프런트엔드는 기존 사이트 배포 방식으로 반영됩니다.
          SUMMARY
      - name: Account deletion setup required
        if: steps.account_permissions.outcome == 'failure'
        run: |
          echo '회원탈퇴 IAM 설정이 필요합니다. 프로젝트 IAM 관리자가 Cloud Shell에서 bash schedule-reminders/setup-account-deletion.sh를 실행해야 합니다. 설정 전에는 API가 데이터 삭제를 시작하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
