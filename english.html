    function dateToKey(dateValue = new Date()) {
        const d = dateValue instanceof Date ? dateValue : new Date(dateValue);
        if (isNaN(d.getTime())) return '';
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function todayKey() { return dateToKey(new Date()); }
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function lessonIndexForDate(dateKey) {
        const d = new Date(`${dateKey}T00:00:00`);
        const days = Math.floor(d.getTime() / 86400000);
        return Math.abs(days) % lessonSets.length;
    }
    function getAllItems(lesson) {
        return [
            ...lesson.expressions.map((item, index) => ({ section:'표현', id:`expression-${index}`, item })),
            ...lesson.idioms.map((item, index) => ({ section:'숙어', id:`idiom-${index}`, item })),
            ...lesson.words.map((item, index) => ({ section:'단어', id:`word-${index}`, item })),
            ...lesson.phrases.map((item, index) => ({ section:'문구', id:`phrase-${index}`, item }))
        ];
    }
    function renderSection(title, items, prefix, open = true) {
        return `
            <details class="study-section" ${open ? 'open' : ''}>
                <summary>${title}</summary>
                ${items.map((item, index) => `
                    <label class="item">
                        <input type="checkbox" class="study-check" data-item-id="${prefix}-${index}">
                        <span><span class="en">${escapeHtml(item[0])}</span><span class="tag">${title.replace(/^.+ /,'')}</span><br><span class="ko">${escapeHtml(item[1])}</span></span>
                    </label>
                `).join('')}
            </details>`;
    }
    function renderLesson() {
        const dateKey = document.getElementById('studyDate').value || todayKey();
        currentLesson = lessonSets[lessonIndexForDate(dateKey)];
        document.getElementById('lessonTitle').innerText = currentLesson.title;
        document.getElementById('lessonDesc').innerText = currentLesson.desc;
        document.getElementById('lessonContent').innerHTML = [
            renderSection('💬 주요 영어 표현', currentLesson.expressions, 'expression', true),
            renderSection('🧩 숙어', currentLesson.idioms, 'idiom', true),
            renderSection('📚 단어', currentLesson.words, 'word', true),
            renderSection('🗣️ 문구', currentLesson.phrases, 'phrase', true)
        ].join('');
        document.getElementById('quizContent').innerHTML = currentLesson.quiz.map((quiz, qi) => `
            <div style="margin-bottom:12px;">
                <div style="font-weight:900; color:#334155;">${qi+1}. ${escapeHtml(quiz.q)}</div>
                ${quiz.choices.map((choice, ci) => `
                    <label><input type="radio" name="quiz-${qi}" value="${ci}"> ${escapeHtml(choice)}</label>
                `).join('')}
            </div>
        `).join('');
        document.querySelectorAll('.study-check').forEach(el => el.addEventListener('change', updateProgress));
        updateProgress();
        loadSavedResult();
    }
    function updateProgress() {
        const checks = [...document.querySelectorAll('.study-check')];
        const done = checks.filter(el => el.checked).length;
        const total = checks.length || 1;
        document.getElementById('progressFill').style.width = `${Math.round(done / total * 100)}%`;
    }

        const answers = [];
        currentLesson.quiz.forEach((quiz, qi) => {
            const checked = document.querySelector(`input[name="quiz-${qi}"]:checked`);
            const selected = checked ? parseInt(checked.value, 10) : null;
            if (selected === quiz.answer) score++;
            answers.push({ question: quiz.q, selected, answer: quiz.answer, correct: selected === quiz.answer });
        });
        return { score, answers };
    }
    async function loadSavedResult() {
        const note = document.getElementById('savedNote');
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';
        note.innerText = '';
        if (!userId) return;
        const dateKey = document.getElementById('studyDate').value || todayKey();
        const snap = await getDoc(doc(db, 'users', userId, 'daily_english_logs', dateKey));
        document.querySelectorAll('.study-check').forEach(el => el.checked = false);
        document.querySelectorAll('input[type="radio"]').forEach(el => el.checked = false);
        document.getElementById('studyMemo').value = '';
        document.getElementById('selfRating').value = '3';
        if (snap.exists()) {
            const data = snap.data();
            (data.completedItemIds || []).forEach(id => {
                const el = document.querySelector(`.study-check[data-item-id="${id}"]`);
                if (el) el.checked = true;
            });
            (data.quizAnswers || []).forEach((answer, qi) => {
                if (answer.selected !== null && answer.selected !== undefined) {
                    const el = document.querySelector(`input[name="quiz-${qi}"][value="${answer.selected}"]`);
                    if (el) el.checked = true;
                }
            });
            if (data.memo) document.getElementById('studyMemo').value = data.memo;
            if (data.selfRating) document.getElementById('selfRating').value = String(data.selfRating);
            note.innerText = `이미 저장된 기록: ${data.completedCount || 0}/${data.totalCount || 0}개 학습 · 퀴즈 ${data.quizScore ?? '-'}점`;
        }
        updateProgress();
    }
    async function saveResult() {
        if (!userId) return alert('로그인이 필요합니다.');
        const dateKey = document.getElementById('studyDate').value || todayKey();
        const allItems = getAllItems(currentLesson);
        const completedItemIds = [...document.querySelectorAll('.study-check:checked')].map(el => el.dataset.itemId);
        const { score, answers } = calculateQuizScore();
        const now = Date.now();
        const payload = {
            dateKey,
            lessonId: currentLesson.id,
            lessonTitle: currentLesson.title,
            completedItemIds,
            completedCount: completedItemIds.length,
            totalCount: allItems.length,
            selfRating: parseInt(document.getElementById('selfRating').value, 10),
            memo: document.getElementById('studyMemo').value.trim(),
            quizScore: score,
            totalQuiz: currentLesson.quiz.length,
            quizAnswers: answers,
            studiedAt: now,
            savedAt: now
        };
        await setDoc(doc(db, 'users', userId, 'daily_english_logs', dateKey), payload, { merge:true });
        await setDoc(doc(db, 'users', userId, 'daily_logs', dateKey), {
            englishStudy: {
                lessonId: payload.lessonId,
                lessonTitle: payload.lessonTitle,
                completedCount: payload.completedCount,
                totalCount: payload.totalCount,
                selfRating: payload.selfRating,
                quizScore: payload.quizScore,
                totalQuiz: payload.totalQuiz,
                memo: payload.memo,
                savedAt: now
            },
            updatedAt: now
        }, { merge:true });
        document.getElementById('savedNote').innerText = `저장 완료: ${payload.completedCount}/${payload.totalCount}개 학습 · 퀴즈 ${payload.quizScore}/${payload.totalQuiz}`;
        const box = document.getElementById('resultBox');
        box.innerText = `오늘의 영어 공부 결과가 ${dateKey} 기준으로 저장되었습니다.`;
        box.style.display = 'block';
    }

    document.getElementById('studyDate').value = todayKey();
    document.getElementById('studyDate').addEventListener('change', renderLesson);
    document.getElementById('saveBtn').addEventListener('click', () => saveResult().catch(e => alert('저장 실패: ' + e.message)));
    document.getElementById('loginBtn').addEventListener('click', () => signInWithPopup(auth, provider).catch(e => alert('로그인 실패: ' + e.message)));
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, user => {
        userId = user ? user.uid : null;
        document.getElementById('loginArea').style.display = user ? 'none' : 'block';
        document.getElementById('studyArea').style.display = user ? 'block' : 'none';
        document.getElementById('logoutBtn').style.display = user ? 'inline-block' : 'none';
        if (user) renderLesson();
    });
</script>
</body>
</html>
