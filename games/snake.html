<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>스네이크 · Alcoholaway</title>
<link rel="stylesheet" href="./game-session.css?v=20261017-1">
<style>
*{box-sizing:border-box}body{margin:0;padding:22px 14px 30px;background:#07120e;color:#e5f8eb;font-family:system-ui,sans-serif}main{max-width:640px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}h1{font-size:clamp(26px,5vw,38px);letter-spacing:2px;margin:2px 0}header small{color:#a7bea8;font-size:11px;letter-spacing:2px}button,select{font:inherit}button{cursor:pointer}.snake-toolbar{display:flex;gap:6px}.snake-toolbar button{background:#172e24;border:1px solid #375b45;color:#d9f6df;border-radius:9px;padding:10px;font-size:12px}.snake-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.snake-scores>div{padding:13px;background:#12271d;border:1px solid #284333;border-radius:12px}.snake-scores small{display:block;font:10px/1.4 monospace;color:#a0b6a3}.snake-scores strong{display:block;color:#baf277;font:700 clamp(21px,5vw,30px)/1.5 monospace}.snake-arena{position:relative;width:min(100%,440px);margin:auto;padding:10px;border-radius:18px;background:#1c3826;border:1px solid #426449;box-shadow:0 14px 55px #0005}canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:7px;background:#0c1c13;outline-offset:4px}.snake-overlay{position:absolute;inset:10px;display:grid;place-content:center;padding:18px;text-align:center;background:#06100deb;gap:12px;border-radius:7px}.snake-overlay h2{font-size:25px;margin:0;color:#c7f6a0}.snake-overlay p{font-size:13px;line-height:1.65;margin:0;color:#a9c3af}.snake-overlay label{font-size:12px;color:#bdcebf}.snake-overlay select{background:#1c3826;color:#e5f8eb;padding:8px;border:1px solid #57735a;border-radius:8px}.snake-primary{color:#10220d;background:#baf277;border:0;border-radius:10px;padding:12px 22px;font-weight:800}.snake-controls{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin:15px auto}.snake-controls button{border:1px solid #486b49;border-bottom:3px solid #2e492e;border-radius:10px;background:#1b3524;color:#dbf4c7;font-size:22px;touch-action:manipulation;user-select:none}.snake-controls button:active{background:#416c3b}.snake-controls [data-direction=up]{grid-column:2}.snake-controls [data-direction=left]{grid-column:1;grid-row:2}.snake-controls [data-direction=down]{grid-column:2;grid-row:2}.snake-controls [data-direction=right]{grid-column:3;grid-row:2}.snake-help{text-align:center;font-size:12px;color:#9db6a2;line-height:1.8}.game-history{background:#0e2118;border-color:#284733}.game-history li{border-color:#284733}.game-history button,.game-account-bar button{background:#163022;border-color:#385d43}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #bef264;outline-offset:3px}@media(max-width:360px){body{padding:12px 10px 24px}header{margin:12px 0}.snake-toolbar{flex-direction:column;gap:4px}.snake-toolbar button{padding:7px}.snake-overlay{gap:8px;padding:10px}.snake-overlay h2{font-size:22px}.snake-overlay p{font-size:12px}}
</style></head><body>
<div id="authGate" class="game-auth-gate"><h1>Alcoholaway</h1><p id="authGateMessage">로그인 상태를 확인하고 있습니다…</p><a href="../index.html">금주 리포트로 돌아가기</a></div>
<main id="gameApp" hidden>
<div class="game-account-bar"><button type="button" id="backButton">← 금주 리포트</button><span id="gameUserBadge"></span></div>
<header><div><small>CLASSIC POCKET ARCADE</small><h1>SNAKE</h1></div><div class="snake-toolbar"><button id="soundButton" aria-pressed="false">소리 끔</button><button id="pauseButton" disabled>일시정지</button></div></header>
<div class="snake-scores" aria-label="게임 현황"><div><small>SCORE · 점수</small><strong id="score">0000</strong></div><div><small>BEST · 내 최고</small><strong id="best">0000</strong></div><div><small>LEVEL · 단계</small><strong id="level">01</strong></div></div>
<div class="snake-arena"><canvas id="game" width="400" height="400" tabindex="0" aria-label="스네이크 게임. 방향키 또는 화면을 밀어서 이동합니다."></canvas><div id="overlay" class="snake-overlay"><h2 id="overlayTitle">한 칸씩, 더 길게.</h2><p id="overlayText">먹이를 모으며 뱀을 키워보세요.<br>벽이나 몸에 닿으면 게임이 끝납니다.</p><label id="difficultyLabel">난이도 <select id="difficulty"><option value="easy">쉬움</option><option value="normal" selected>보통</option></select></label><button id="startButton" class="snake-primary">게임 시작</button></div></div>
<div class="snake-controls" aria-label="이동 방향"><button data-direction="up" aria-label="위로">↑</button><button data-direction="left" aria-label="왼쪽으로">←</button><button data-direction="down" aria-label="아래로">↓</button><button data-direction="right" aria-label="오른쪽으로">→</button></div>
<p class="snake-help">방향키 / W A S D · 모바일은 방향 버튼 또는 게임 화면 스와이프<br>P / Esc 일시정지 · 먹이 5개마다 조금씩 빨라져요</p>
<section class="game-history" aria-labelledby="historyTitle"><div class="game-history-heading"><h2 id="historyTitle">내 스네이크 기록</h2><button id="refreshHistoryButton">새로고침</button></div><p id="scoreHistorySummary">내 최고 0점</p><p id="scoreHistoryStatus" role="status">로그인 확인 중…</p><button id="retryScoreButton" hidden>다시 저장</button><ol id="scoreHistoryList"></ol></section>
</main><script type="module" src="./snake.js?v=20261017-1"></script></body></html>
